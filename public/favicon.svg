<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <rect width="100" height="100" rx="22" fill="#0B0F19"/>
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4"/>
  <defs>
    <linearGradient id="cxGoldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE899" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="cxGoldAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="cxNavyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="cxEmeraldVector" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <filter id="cxGlowEmerald" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#10B981" flood-opacity="0.7" />
    </filter>

    <filter id="cxGlowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- SUBTLE BACKGROUND GEOMETRIC PATTERN -->
  <g opacity="0.15">
    <line x1="10" y1="50" x2="90" y2="50" stroke="#F59E0B" stroke-width="0.75" stroke-dasharray="2 3" />
    <line x1="50" y1="10" x2="50" y2="90" stroke="#F59E0B" stroke-width="0.75" stroke-dasharray="2 3" />
    <circle cx="50" cy="50" r="36" stroke="#F59E0B" stroke-width="0.75" stroke-dasharray="3 3" />
  </g>

  <!-- GEOMETRIC MONOGRAM 'CX' -->
  <!-- 1. LETTER 'C' -->
  <path
    d="M 56 20 C 32 20, 18 34, 18 50 C 18 66, 32 80, 56 80 L 56 68 C 39 68, 30 59, 30 50 C 30 41, 39 32, 56 32 Z"
    fill="url(#cxGoldPrimary)"
    filter="url(#cxGlowGold)"
  />

  <!-- Inner Gold Highlight Facet on 'C' -->
  <path
    d="M 56 20 C 34 20, 22 34, 22 50 C 22 52, 22.2 54, 22.5 56 C 24 43, 34 32, 56 32 Z"
    fill="url(#cxGoldAccent)"
    opacity="0.9"
  />

  <!-- 2. LETTER 'X' - Descending Midnight Ray -->
  <path
    d="M 46 22 L 74 78 L 84 78 L 56 22 Z"
    fill="url(#cxNavyGradient)"
    stroke="#38BDF8"
    stroke-width="0.5"
    opacity="0.9"
  />

  <!-- 3. LETTER 'X' - Ascending Financial Bullish Vector -->
  <path
    d="M 38 78 L 76 26"
    stroke="url(#cxEmeraldVector)"
    stroke-width="7"
    stroke-linecap="round"
    filter="url(#cxGlowEmerald)"
  />

  <path
    d="M 38 78 L 60 48"
    stroke="url(#cxGoldPrimary)"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Ascending Market Arrow Tip -->
  <path
    d="M 64 22 L 82 22 L 82 40 Z"
    fill="url(#cxEmeraldVector)"
    filter="url(#cxGlowEmerald)"
  />

  <!-- 4. EMERALD PRECISION SPARK -->
  <polygon points="56,42 62,48 56,54 50,48" fill="#34D399" filter="url(#cxGlowEmerald)" />
  <polygon points="56,44 60,48 56,52 52,48" fill="#FFFFFF" />

  <!-- 5. TOP RIGHT ACCENT DOT -->
  <circle cx="82" cy="18" r="3" fill="#34D399" filter="url(#cxGlowEmerald)" />
</svg>
